services:
  postgres:
    image: postgres:16-alpine
    container_name: emenu_postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER:-emenu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-emenu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emenu_user} -d ${POSTGRES_DB:-emenu_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - emenu_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emenu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emenu_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-emenu_db}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - emenu_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emenu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Ho_Chi_Minh
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - emenu_network

volumes:
  postgres_data:

networks:
  emenu_network:
    name: emenu_network
